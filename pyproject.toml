[project]
name = "hansken-extraction-plugin-template-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "certifi==2026.5.20",
    "charset-normalizer==3.4.7",
    "decorator==5.3.1",
    "docker==7.1.0",
    "grpcio==1.81.0",
    "hansken==2026.5.27",
    "hansken-extraction-plugin==0.10.0",
    "idna==3.18",
    "ijson==3.5.0",
    "iso8601==2.1.0",
    "logbook==1.9.2",
    "more-itertools==11.1.0",
    "poethepoet>=0.46.0",
    "protobuf==7.35.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.2",
    "requests==2.34.2",
    "requests-toolbelt==1.0.0",
    "six==1.17.0",
    "tabulate==0.10.0",
    "typing-extensions==4.15.0",
    "urllib3==2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hansken_extraction_plugin_template_python"]

[dependency-groups]
dev = [
    "poethepoet>=0.46.0",
    "ruff>=0.15.17",
]

[tool.poe.tasks]
lint = "uv run ruff check"
build = "uv build"
test = "uv run test_plugin --standalone plugin.py"
regenerate = "uv run test_plugin --standalone plugin.py --regenerate"

[tool.poe.tasks.package]
sequence = [
    { cmd = "uv build" },
    { cmd = "uv run build_plugin ." }
]

[tool.poe.tasks.integration-test]
sequence = [
    { cmd = "uv run build_plugin . plugin-to-test" },
    { cmd = "uv run test_plugin --docker plugin-to-test" },
]

[tool.poe.tasks.upgrade]
sequence = [
    { cmd = "uv lock" },
    { cmd = "uv sync" },
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 140
indent-width = 4

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E4",
    "E5",
    "E7",
    "E9",
    "F",
    "PLC"
]
ignore = []


